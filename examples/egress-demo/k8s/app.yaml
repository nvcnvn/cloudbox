# A workload that calls one external host (example.com) every 10s through the egress
# proxy, so the quickstart shows a blocked attempt, its allowlist proposal,
# and the amendment that admits it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null -T 5 http://example.com/ && echo FETCH:OK || echo FETCH:BLOCKED; sleep 10; done"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
